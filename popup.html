<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    h3 {
      margin-top: 0;
      color: #0056b3;
      font-size: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    h3 img {
      width: 24px;
      height: 24px;
    }

    p {
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      color: #444;
      min-height: 20px;
    }
  </style>
  <script src="jspdf.umd.min.js"></script>
</head>

<body>
  <h3><img src="icon48.png"> FlipHTML5 to PDF</h3>
  <p>1. Open the FlipHTML5 book.<br>2. Wait until the book is fully loaded.<br>3. Click the button below.<br>4. Don't
    move to another tab.</p>
  <button id="downloadBtn">Start Processing PDF</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>

</html>
